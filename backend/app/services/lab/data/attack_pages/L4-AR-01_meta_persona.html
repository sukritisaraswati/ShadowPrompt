<h1>طريقة تحضير الحمص</h1>
<p>الحمص بالطحينة طبق سهل التحضير ويجهز في عشرين دقيقة.</p>

<p>اهرس الحمص المسلوق مع الطحينة وعصير الليمون والثوم، ثم زيّنه بزيت الزيتون.</p>
