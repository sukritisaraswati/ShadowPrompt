name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadowprompt
          POSTGRES_PASSWORD: shadowprompt
          POSTGRES_DB: shadowprompt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadowprompt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,pdf,layer3,render]"
          python -m playwright install --with-deps chromium-headless-shell

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        # GitHub's Ubuntu runners restrict the user namespaces Chromium's
        # sandbox needs, so the rendering tests run with the runner as the
        # sandbox, as in the Docker image.
        env:
          SCANNER_RENDER_CHROMIUM_SANDBOX: "false"
        run: pytest --cov=app --cov-report=term-missing

      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://shadowprompt:shadowprompt@localhost:5432/shadowprompt_test
        run: alembic upgrade head

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://shadowprompt:shadowprompt@localhost:5432/shadowprompt_test
        run: alembic check

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npx vite build

  cli:
    name: CLI (lint, tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

  action:
    name: GitHub Action end to end
    runs-on: ubuntu-latest
    needs: [backend, cli]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start ShadowPrompt and a stub model
        working-directory: backend
        env:
          LLM_ALLOW_PRIVATE_ENDPOINTS: "true"
          RATE_LIMIT_SCANS_PER_MINUTE: "1000"
        run: |
          python -m pip install --quiet -e .
          alembic upgrade head
          nohup python tools/stub_llm.py --mode aligned --port 9000 > stub.log 2>&1 &
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

      - name: A clean page passes
        uses: ./
        with:
          command: scan
          server-url: http://127.0.0.1:8000
          targets: backend/app/services/scanner/demo_pages/clean.html
          fail-on: low

      - name: An attack page fails the scan
        id: attack
        continue-on-error: true
        uses: ./
        with:
          command: scan
          server-url: http://127.0.0.1:8000
          targets: backend/app/services/scanner/demo_pages
          fail-on: high

      - name: Check the attack page failed
        if: steps.attack.outcome != 'failure'
        run: |
          echo "::error::The scan should have failed on the attack pages."
          exit 1

      - name: An aligned model passes a campaign
        id: campaign
        uses: ./
        with:
          command: campaign
          server-url: http://127.0.0.1:8000
          base-url: http://127.0.0.1:9000/v1
          model: stub-aligned
          levels: "1,2"
          sample-size: "3"
          min-score: "90"
          report: reports/campaign.html

      - name: Check the campaign outputs
        env:
          SCORE: ${{ steps.campaign.outputs.score }}
        run: |
          test -s reports/campaign.html
          python -c "import os, sys; sys.exit(0 if float(os.environ['SCORE']) >= 90 else 1)"

  extension:
    name: Browser extension (tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: npm test
